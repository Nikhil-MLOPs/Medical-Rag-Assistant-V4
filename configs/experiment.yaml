experiment_name: Experiments using qwen2.5:0.5b
golden_dataset_path: data/golden/golden_dataset.jsonl
tracking_uri: https://dagshub.com/Nikhil-MLOPs/Medical-Rag-Assistant-V4.mlflow

num_trials: 50

search_space:
  hybrid_alpha: [0.5, 0.6, 0.7, 0.8]
  top_k_dense: [2, 3, 4]
  top_k_sparse: [2, 4]
  top_k_final: [2, 3]
  temperature: [0.0, 0.2, 0.4]
  reranker_boost: [0.2, 0.3, 0.4]

metrics_weights:
  precision: 1.0
  recall: 1.0
  faithfulness: 1.5
  answer_relevance: 1.2
  citation_coverage: 1.0
  latency_penalty: 0.3

latency_threshold_seconds: 5.0