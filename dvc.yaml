# Phase-1: Ingestion
stages:
  ingestion:
    cmd: python -m src.ingestion.ingest
    deps:
      - src/ingestion/ingest.py
      - data/raw
    outs:
      - data/processed/pages/pages.jsonl

  # Phase-2: Cleaning + Chunking
  cleaning:
    cmd: python -m src.cleaning.clean
    deps:
      - src/cleaning/clean.py
      - data/processed/pages/pages.jsonl
    outs:
      - data/processed/chunks/chunks.jsonl

  # Phase-3: Embedding
  embeddings:
    cmd: python -m src.embeddings.embed
    deps:
      - src/embeddings/embed.py
      - data/processed/chunks/chunks.jsonl
    outs:
      - data/embeddings/embeddings.npy
      - data/embeddings/metadata.json

  # Phase-4: Vector Store Build
  vectorstore:
    cmd: python -m src.embeddings.vectorstore
    deps:
      - data/embeddings/embeddings.npy
      - data/embeddings/metadata.json
      - data/processed/chunks/chunks.jsonl
      - src/embeddings/vectorstore.py
      - configs/vectorstore.yaml
    outs:
      - data/chroma_db